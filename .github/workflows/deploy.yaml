name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v4

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Dependencies
        run: npm ci
      - name: Cache semantic search assets
        id: semantic-cache
        uses: actions/cache@v4
        with:
          path: |
            quartz/static/sem
            .cache
          key: semantic-v1-${{ runner.os }}-${{ hashFiles('content/**/*.md', 'content/**/*.mdx', 'scripts/build-semantic.ts', 'package-lock.json') }}
      - name: Build semantic index
        if: steps.semantic-cache.outputs.cache-hit != 'true'
        run: npm run build:sem
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
